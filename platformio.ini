; PlatformIO configuration.
;
; Targets:
;   lolin32             - Wemos Lolin32 OLED: IR monitor + NEC/Vatos decode + TX
;   lolin32_displaytest - OLED driver/geometry config finder
;   esp32-s3-matrix     - ESP32-S3-Matrix: 8x8 LED laser-tag target
;
; Wireless: both firmware targets bring up WiFi (credentials set over serial via
; the TagNet library, stored in NVS), ArduinoOTA, and UDP telemetry. After one
; USB flash, update over the air:
;   pio run -e <target>-ota -t upload

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; printf/snprintf format checking, promoted to an ERROR.
;
; A format string whose specifiers don't match its arguments is a runtime crash
; on the device, not a compile error by default — a stray %s then reads an int
; as a pointer. That exact bug (an argument added without its specifier) took a
; board off the network in a boot loop: every HTTP request to the status page
; panicked with LoadProhibited, and it cost a USB recovery to find. The
; compiler can see it for free, so let it.
build_flags = -Wformat=2 -Werror=format

; --- Lolin32 (ESP32) shared settings ---------------------------------------
[lolin32_base]
board = lolin32
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.11
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7

; Main firmware: IR monitor + NEC/Vatos decode + IR transmit
[env:lolin32]
extends = lolin32_base
build_flags = ${env.build_flags} -D BOARD_LOLIN32
build_src_filter = +<*> -<display_test.cpp> -<matrix_main.cpp> -<rf_probe.cpp>

; Diagnostic firmware: cycles OLED driver/geometry configs
[env:lolin32_displaytest]
extends = lolin32_base
build_flags = ${env.build_flags} -D BOARD_LOLIN32
build_src_filter = +<*> -<main.cpp> -<matrix_main.cpp> -<rf_probe.cpp>

; OTA variant of the main Lolin32 firmware (after one USB flash).
; mDNS (lasertag-lolin32.local) now resolves on this host, but espota is
; unreliable with mDNS names — keep the current DHCP IP here (set a DHCP
; reservation for the board or update this if the IP changes).
[env:lolin32-ota]
extends = env:lolin32
upload_protocol = espota
; STALE as of 2026-07-29: the Lolin32 was offline and .48 now answers as some
; other device. Re-discover it from the heartbeat roster (host `devices`) before
; using this env, and update the address.
upload_port = 192.168.1.48

; --- ESP32-S3-Matrix --------------------------------------------------------
; 8x8 WS2812 matrix on GPIO14; IR receiver on GPIO1; activity LED on GPIO7.
[env:esp32-s3-matrix]
board = esp32-s3-devkitc-1
; The ESP32-S3-Matrix is an ESP32-S3FH4R2 with 4MB flash (not the devkit's 8MB);
; the header must match or the flash probe asserts at boot (reboot loop).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = ${env.build_flags} -D ARDUINO_USB_CDC_ON_BOOT=1 -D BOARD_S3_MATRIX
; Don't toggle DTR/RTS when opening the serial monitor — on the S3's USB-CDC
; that resets the board into the bootloader. Lets `pio device monitor` observe
; logs and send commands (e.g. "bright 8") safely.
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7
build_src_filter = +<matrix_main.cpp>

; OTA variant of the matrix firmware (after one USB flash).
; mDNS (lasertag-matrix.local) now resolves on this host, but espota is
; unreliable with mDNS names — keep the current DHCP IP here. The matrix roams
; via DHCP (.24 -> .28 -> .33 -> .34 so far); check the heartbeat / `ping
; lasertag-matrix.local` and update this before an OTA, or set a reservation.
; Board 2 (lasertag-matrix2, id=eb278c) is at .180: pass --upload-port to
; override.
[env:esp32-s3-matrix-ota]
extends = env:esp32-s3-matrix
upload_protocol = espota
upload_port = 192.168.1.34

; --- ESP8266 RF probe ------------------------------------------------------
; nRF24L01+ pulled from the LC Technology NRF24L01-TTL_V2 adaptor and wired to
; an ESP8266 (CP210x, COM6). Receive-only 2.4GHz reconnaissance of the Vatos
; kit's data-sync link; see
; docs/superpowers/specs/2026-07-28-rf-protocol-analysis-design.md.
; Wiring: CE=GPIO4 CSN=GPIO5 SCK=GPIO14 MOSI=GPIO13 MISO=GPIO12 (IRQ unused),
; VCC=3V3 with a 10uF cap at the module.
[env:esp8266-rfprobe]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_src_filter = +<rf_probe.cpp>

; --- Native unit tests ------------------------------------------------------
; Pure-logic tests for the ControlProto library against the wire-contract
; golden vectors. Runs host-compiled (no board) via PlatformIO's built-in Unity.
; lib_ignore keeps the Arduino-only shared libs out of the LDF so the native
; toolchain never sees Arduino.h / FastLED / WiFi.
[env:native]
platform = native
; The shared [env] sets framework = arduino, which native does not provide;
; clear it so the host toolchain compiles plain C++.
framework =
lib_deps =
    bblanchon/ArduinoJson@^7
lib_ignore =
    TagNet
    Vatos
    IrFramer
    HitDisplay
    IrTx
    Sound
    BoardNvs
    SdCard
